[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veriforge"
version = "0.1.0"
description = "VeriForge — verifiable local coding-agent runtime"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "jsonschema>=4.23.0,<5",
    "tiktoken>=0.5.0",
    "playwright>=1.40.0",
    "psutil>=5.9.8,<8",
    "mcp>=1.0.0",
    "BM25>=0.3,<1",
]

[project.optional-dependencies]
eval = [
    "datasets>=5.0.0",
    "pyarrow>=21.0.0",
    "harbor>=0.13; python_version >= '3.12'",
]

[project.scripts]
veriforge = "harness_code_agent.cli:main"

[tool.setuptools.packages.find]
include = ["harness_code_agent*"]

[tool.setuptools.package-data]
"harness_code_agent.skills" = ["catalog/**/*"]
"harness_code_agent.profiles" = ["*.json"]

[tool.ruff.lint.per-file-ignores]
# These files sit on deliberate failure boundaries: any exception from a tool
# handler, LLM/network call, plugin resolver, worker thread or UI bridge is
# converted into a failed result, a log line, or a graceful degradation
# instead of crashing the agent loop.
"harness_code_agent/agent/conversation.py" = ["BLE001"]
"harness_code_agent/agent/llm_channel.py" = ["BLE001"]
"harness_code_agent/agent/tool_executor.py" = ["BLE001"]
"harness_code_agent/cli.py" = ["BLE001"]
"harness_code_agent/core/interactive.py" = ["BLE001"]
"harness_code_agent/runtime/approvals.py" = ["BLE001"]
"harness_code_agent/runtime/builtins/browser.py" = ["BLE001"]
"harness_code_agent/runtime/builtins/shell.py" = ["BLE001"]
"harness_code_agent/runtime/builtins/web.py" = ["BLE001"]
"harness_code_agent/runtime/mcp.py" = ["BLE001"]
"harness_code_agent/runtime/middleware/memory.py" = ["BLE001"]
"harness_code_agent/runtime/middleware/verification.py" = ["BLE001"]
"harness_code_agent/runtime/tool_runner.py" = ["BLE001"]
"harness_code_agent/sessions/events.py" = ["BLE001"]
"harness_code_agent/sessions/turn_summary.py" = ["BLE001"]
"harness_code_agent/tui/approval.py" = ["BLE001"]
"harness_code_agent/tui_bridge.py" = ["BLE001"]
"harness_code_agent/workspace/shell_jobs.py" = ["BLE001"]
"harness_code_agent/workspace/shell_session.py" = ["BLE001"]
# Benchmark entrypoints must record arbitrary agent/runtime failures as failed
# trials. The terminal runner also catches BaseException to preserve partial
# artifacts when the benchmark process is interrupted.
"eval/benchmarks/hca_claw_runner.py" = ["BLE001"]
"eval/benchmarks/hca_terminal_runner.py" = ["BLE001"]
